name: Deploy Vibe to one.com

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate packaging and target paths without uploading
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-vibe-onecom
  cancel-in-progress: false

jobs:
  deploy:
    # Live deployment only runs with the reviewed workflow on the trusted main ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      ONECOM_HOST: ${{ vars.ONECOM_HOST }}
      ONECOM_USER: ${{ secrets.ONECOM_SSH_USER || vars.ONECOM_USER }}
      ONECOM_SSH_PASSWORD: ${{ secrets.ONECOM_SSH_PASSWORD }}
      ONECOM_SSH_KEY: ${{ secrets.ONECOM_SSH_KEY }}
      ONECOM_SSH_PORT: ${{ vars.ONECOM_SSH_PORT || '22' }}
      ONECOM_PUBLIC_BASE_URL: ${{ vars.ONECOM_PUBLIC_BASE_URL || 'https://yven.me' }}
      DEPLOY_TARGET_PATH: /customers/3/3/f/yven.me/httpd.www/vibe/
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate and package static site
        shell: bash
        run: |
          set -euo pipefail
          test -f vibe/index.html || { echo 'Missing vibe/index.html'; exit 1; }
          test -f vibe/catalog.json || { echo 'Missing vibe/catalog.json'; exit 1; }
          node --check vibe/assets/hub.js
          for app_script in vibe/*/app.js; do node --check "$app_script"; done
          node --test tests/*.test.mjs
          node <<'NODE'
          const fs = require('node:fs');
          const catalog = JSON.parse(fs.readFileSync('vibe/catalog.json', 'utf8'));
          for (const { slug } of catalog.apps) {
            if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) throw new Error('Invalid slug: ' + slug);
            const routeDir = 'vibe/' + slug + '/';
            const entry = routeDir + 'index.html';
            if (!fs.existsSync(entry)) throw new Error('Missing index.html for ' + slug);
            const html = fs.readFileSync(entry, 'utf8');
            for (const [, rawTarget] of html.matchAll(/(?:href|src)=["']([^"']+)["']/gi)) {
              if (/^(?:[a-z]+:|\/\/|#)/i.test(rawTarget)) continue;
              let target = rawTarget;
              if (target.startsWith('/vibe/')) target = 'vibe/' + target.slice('/vibe/'.length);
              else if (target.startsWith('/')) continue;
              else target = routeDir + target;
              target = target.split(/[?#]/, 1)[0];
              if (target.endsWith('/')) target += 'index.html';
              if (!fs.existsSync(target)) throw new Error('Missing linked resource ' + target + ' for ' + slug);
            }
          }
          NODE
          route_slugs="$(node -e "const c=require('./vibe/catalog.json'); process.stdout.write(c.apps.map(a=>a.slug).join(' '))")"
          echo "VIBE_ROUTE_SLUGS=$route_slugs" >> "$GITHUB_ENV"
          mkdir -p dist
          tar -czf dist/vibe-site.tar.gz -C vibe .
          tar -tzf dist/vibe-site.tar.gz
          echo 'Package validated for /vibe/.'

      - name: Validate fixed deploy target
        shell: bash
        run: |
          set -euo pipefail
          [ "${DEPLOY_TARGET_PATH}" = '/customers/3/3/f/yven.me/httpd.www/vibe/' ] || { echo 'Unexpected deploy target'; exit 1; }
          case "${DEPLOY_TARGET_PATH}" in /customers/*/httpd.www/vibe/) ;; *) echo 'Deploy target is outside the expected public site tree'; exit 1 ;; esac
          echo "Dry-run destination: ${DEPLOY_TARGET_PATH}"

      - name: Validate deploy credentials and destination
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${ONECOM_HOST:-}" ] || { echo 'Missing ONECOM_HOST repository variable'; exit 1; }
          [ -n "${ONECOM_USER:-}" ] || { echo 'Missing ONECOM_SSH_USER secret or ONECOM_USER variable'; exit 1; }
          [ -n "${ONECOM_SSH_PASSWORD:-}${ONECOM_SSH_KEY:-}" ] || { echo 'Set ONECOM_SSH_PASSWORD or ONECOM_SSH_KEY'; exit 1; }

      - name: Setup SSH
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${ONECOM_SSH_KEY:-}" ]; then
            printf '%s\n' "$ONECOM_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            echo 'SSH_AUTH_MODE=key' >> "$GITHUB_ENV"
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
            echo 'SSH_AUTH_MODE=password' >> "$GITHUB_ENV"
          fi
          ssh-keyscan -p "$ONECOM_SSH_PORT" "$ONECOM_HOST" >> ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo 'Could not retrieve the one.com SSH host key'; exit 1; }
          chmod 600 ~/.ssh/known_hosts

      - name: Promote, smoke check, and rollback on failure
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          run_ssh() {
            if [ "$SSH_AUTH_MODE" = 'key' ]; then
              ssh -p "$ONECOM_SSH_PORT" "$ONECOM_USER@$ONECOM_HOST" "$1"
            else
              SSHPASS="$ONECOM_SSH_PASSWORD" sshpass -e ssh -p "$ONECOM_SSH_PORT" "$ONECOM_USER@$ONECOM_HOST" "$1"
            fi
          }
          upload_via_ssh() {
            if [ "$SSH_AUTH_MODE" = 'key' ]; then
              ssh -p "$ONECOM_SSH_PORT" "$ONECOM_USER@$ONECOM_HOST" "cat > '$2'" < "$1"
            else
              SSHPASS="$ONECOM_SSH_PASSWORD" sshpass -e ssh -p "$ONECOM_SSH_PORT" "$ONECOM_USER@$ONECOM_HOST" "cat > '$2'" < "$1"
            fi
          }
          run_ssh_script() {
            remote_command="bash -s -- '$target' '$stage' '$backup' '$remote_package' '$route_slugs'"
            if [ "$SSH_AUTH_MODE" = 'key' ]; then
              ssh -p "$ONECOM_SSH_PORT" "$ONECOM_USER@$ONECOM_HOST" "$remote_command"
            else
              SSHPASS="$ONECOM_SSH_PASSWORD" sshpass -e ssh -p "$ONECOM_SSH_PORT" "$ONECOM_USER@$ONECOM_HOST" "$remote_command"
            fi
          }
          route_slugs="$VIBE_ROUTE_SLUGS"
          run_id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          target="${DEPLOY_TARGET_PATH%/}"
          parent="$(dirname "$target")"
          stage="${parent}/.vibe-stage-${run_id}"
          backup="${parent}/.vibe-backup-${run_id}"
          remote_package="${stage}/vibe-site.tar.gz"
          run_ssh "set -euo pipefail; mkdir -m 700 '${stage}'"
          upload_via_ssh dist/vibe-site.tar.gz "$remote_package"
          deployment_committed=0
          promotion_started=0
          previous_target_exists="$(run_ssh "if [ -e '${target}' ]; then printf 1; else printf 0; fi")"
          rollback_local() {
            exit_code=$?
            trap - EXIT HUP INT TERM
            if [ "$deployment_committed" -ne 1 ]; then
              if [ "$promotion_started" -eq 1 ]; then
                if [ "$previous_target_exists" = '1' ]; then
                  run_ssh "set -e; if [ -e '${backup}' ]; then rm -rf '${target}'; find '${backup}' -type d -exec chmod 755 {} +; find '${backup}' -type f -exec chmod 644 {} +; mv '${backup}' '${target}'; fi; rm -rf '${stage}'" || echo 'Rollback attempt failed; preserve backup path for manual recovery.'
                else
                  run_ssh "set -e; rm -rf '${target}' '${stage}'" || echo 'Rollback attempt failed; inspect the one.com target manually.'
                fi
              else
                run_ssh "rm -rf '${stage}'" || echo 'Could not remove the incomplete staging folder.'
              fi
            fi
            exit "$exit_code"
          }
          trap rollback_local EXIT HUP INT TERM
          promotion_started=1
          run_ssh_script "$target" "$stage" "$backup" "$remote_package" <<'REMOTE'
          set -euo pipefail
          target="$1"
          stage="$2"
          backup="$3"
          remote_package="$4"
          restore_if_interrupted() {
            code=$?
            trap - EXIT HUP INT TERM
            if [ -e "$backup" ] && [ ! -e "$target" ]; then
              find "$backup" -type d -exec chmod 755 {} +
              find "$backup" -type f -exec chmod 644 {} +
              mv "$backup" "$target"
            fi
            exit "$code"
          }
          trap restore_if_interrupted EXIT HUP INT TERM
          test -s "$remote_package"
          tar -xzf "$remote_package" -C "$stage"
          rm -f "$remote_package"
          test -f "$stage/index.html"
          test -f "$stage/catalog.json"
          route_slugs="$5"
          for slug in $route_slugs; do
            case "$slug" in ''|*[!a-z0-9-]*) echo 'Invalid route slug in package manifest'; exit 1 ;; esac
            test -f "$stage/$slug/index.html"
            for asset in app.js style.css; do
              if [ -e "$stage/$slug/$asset" ] && [ ! -f "$stage/$slug/$asset" ]; then
                echo "Route asset is not a regular file: $slug/$asset"
                exit 1
              fi
            done
          done
          find "$stage" -type d -exec chmod 755 {} +
          find "$stage" -type f -exec chmod 644 {} +
          if [ -e "$target" ]; then mv "$target" "$backup"; chmod -R 700 "$backup"; fi
          mv "$stage" "$target"
          trap - EXIT HUP INT TERM
          REMOTE
          base="${ONECOM_PUBLIC_BASE_URL%/}"
          response="$(mktemp)"
          status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' "${base}/vibe/?cb=${GITHUB_RUN_ID}")"
          echo "Smoke /vibe/: $status"
          [ "$status" = '200' ] && grep -q 'Små verktøy' "$response"
          rm -f "$response"
          for slug in $route_slugs; do
            path="/vibe/$slug/"
            response="$(mktemp)"
            status="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' "${base}${path}?cb=${GITHUB_RUN_ID}")"
            echo "Smoke $path: $status"
            [ "$status" = '200' ] && grep -qi '<title' "$response"
            rm -f "$response"
            for asset in app.js style.css; do
              [ -f "vibe/$slug/$asset" ] || continue
              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${base}${path}${asset}?cb=${GITHUB_RUN_ID}")"
              echo "Smoke asset ${path}${asset}: $status"
              [ "$status" = '200' ] || exit 1
            done
          done
          for path in /vibe/catalog.json /vibe/assets/hub.js /vibe/assets/hub.css; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${base}${path}?cb=${GITHUB_RUN_ID}")"
            echo "Smoke asset $path: $status"
            [ "$status" = '200' ] || exit 1
          done
          deployment_committed=1
          run_ssh "rm -rf '${backup}' '${stage}'" || echo 'Published successfully; stale backup/staging cleanup can be performed later.'
