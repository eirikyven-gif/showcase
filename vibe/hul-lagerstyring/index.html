<!doctype html>
<html lang="no" class="h-full bg-slate-100">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" />
    <meta name="theme-color" content="#dbeafe" />
    <title>HUL Lagerstyring · lokal demo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              hulBlue: '#1d4ed8',
              hulBlueDark: '#1e3a8a',
              hulBlueSoft: '#dbeafe'
            }
          }
        }
      };
    </script>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
    </style>
  </head>
  <body class="h-full text-slate-900">
    <aside class="sticky top-0 z-50 border-b-2 border-amber-500 bg-amber-50 px-4 py-3 text-sm text-slate-900 shadow" aria-label="Viktig informasjon om demoen">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3">
        <p><strong>Lokaldemo med oppdiktede data.</strong> Ikke legg inn navn, kontaktopplysninger eller andre personopplysninger. Endringer lagres i nettleserens localStorage på denne enheten; tilbakestillingen sletter demoens lagrede data.</p>
        <button id="demo-reset" type="button" class="shrink-0 rounded-lg border border-amber-800 bg-white px-3 py-2 font-semibold focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-800">Nullstill demo</button>
      </div>
    </aside>
    <div id="app-root" class="min-h-full">
      <div class="min-h-screen bg-slate-100">
        <main class="mx-auto flex min-h-screen w-full max-w-6xl items-center justify-center px-4 py-6 sm:px-6">
          <section class="w-full max-w-lg rounded-xl border border-slate-200 bg-white p-6 text-center" role="status" aria-live="polite">
            <p class="text-sm font-semibold text-hulBlueDark">Hell Ultra Lagerstyring</p>
            <h1 class="mt-2 text-xl font-semibold text-slate-900">Laster app-shell…</h1>
            <p class="mt-2 text-sm text-slate-700">Klargjører innlogging og sesjon.</p>
          </section>
        </main>
      </div>
    </div>
    <script src="./runtime-config.js?v=__RUNTIME_CONFIG_VERSION__"></script>
    <script>
      document.getElementById('demo-reset').addEventListener('click', function () {
        if (!window.confirm('Slett alle lokale demoendringer og last inn eksempeldata på nytt?')) return;
        try {
          localStorage.removeItem('HUL_MOCK_DB_v1');
          ['hul:', 'hul_'].forEach(function (prefix) {
            for (var i = localStorage.length - 1; i >= 0; i--) {
              var key = localStorage.key(i);
              if (key && key.indexOf(prefix) === 0) localStorage.removeItem(key);
            }
            for (var j = sessionStorage.length - 1; j >= 0; j--) {
              var sessionKey = sessionStorage.key(j);
              if (sessionKey && sessionKey.indexOf(prefix) === 0) sessionStorage.removeItem(sessionKey);
            }
          });
        } catch (_error) { /* Private browsing may disable storage. */ }
        window.location.reload();
      });
    </script>
    <script>
      // Last mock-backend.js kun når mockBackend er aktivert i runtime-config.
      // Slik unngår vi 404 i produksjon der filen ikke deployes.
      // async=false sikrer at mock-backend.js kjøres før det utsatte app.js.
      if (window.__HUL_RUNTIME_CONFIG && window.__HUL_RUNTIME_CONFIG.mockBackend === true) {
        var mockScript = document.createElement('script');
        mockScript.src = './mock-backend.js';
        mockScript.async = false;
        mockScript.onerror = function () {
          // Fail-safe: ikke lås appen i evig lasting hvis mock-script mangler/feiler.
          window.__hulMockBackendReady = true;
          document.dispatchEvent(new CustomEvent('hulMockBackendReady'));
        };
        document.head.appendChild(mockScript);
      }
    </script>
    <script src="./app.js?v=__APP_JS_VERSION__" defer></script>
  </body>
</html>
