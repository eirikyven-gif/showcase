<!doctype html>
<html lang="nb">
<head><script src="../../../assets/demo-api.js" defer></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gjøremålsregistreringer for en Ukelønn-bruker.">
  <title>Gjøremålshistorikk – Ukelønn</title>
  <link rel="stylesheet" href="../../../assets/ukelonn.css">

  <script src="../../../assets/user-history-admin.js" defer></script>
</head>
<body data-app-root="../../../" data-role="admin" data-login="../../../admin/logg-inn/">
  <a class="skip-link" href="#main-content">Hopp til innhold</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="../../../" aria-label="Ukelønn, gå til startsiden"><span class="brand-mark" aria-hidden="true">U</span><span><strong>Ukelønn</strong><span class="brand-subtitle">Administrasjon</span></span></a>
      <button class="button button-secondary" type="button" data-logout>Logg ut</button>
    </div>
  </header>
  <nav class="primary-nav" aria-label="Adminnavigasjon">
    <div class="nav-inner">
      <a class="nav-link" href="../../../admin/">Oversikt</a>
      <a class="nav-link" href="../../../admin/gjoremal/">Gjøremål</a>
      <a class="nav-link" href="../" aria-current="page">Brukere</a>
      <a class="nav-link" href="../../../admin/forslag/">Forslag</a>
      <a class="nav-link" href="../../../admin/perioder/">Perioder</a>
      <a class="nav-link" href="../../../admin/utbetalinger/">Utbetalinger</a>
    </div>
  </nav>
  <main id="main-content" class="page-shell">
    <p><a class="button button-secondary history-back-link" href="../">Tilbake til brukere</a></p>
    <section class="intro">
      <p class="eyebrow">Skrivebeskyttet historikk</p>
      <h1 data-user-history-title>Gjøremålshistorikk</h1>
      <p class="intro-copy" data-user-history-status>Laster bruker …</p>
    </section>
    <section class="panel">
      <h2>Registreringer</h2>
      <div data-user-history><p class="empty-state">Laster gjøremålshistorikk …</p></div>
    </section>
  </main>

</html>
