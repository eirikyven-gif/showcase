<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a9283c">
  <meta name="description" content="En selvstendig nedtellingstimer med pause, fortsettelse og ferdigstatus.">
  <title>Timer v1.2.0 · Vibe</title>
  <link rel="canonical" href="/vibe/timer/">
  <link rel="stylesheet" href="/vibe/assets/hub.css">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#timer">Hopp til timeren</a>
  <header class="site-header">
    <a class="brand" href="/vibe/" aria-label="Vibe – forsiden">vibe<span>.</span></a>
    <nav class="route-links" aria-label="Navigasjon">
      <a class="back-link" href="/vibe/tidteller/">← Til portal</a>
      <a class="back-link" href="/vibe/">Alle verktøy</a>
    </nav>
  </header>
  <main id="timer" class="page-shell">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">Tidteller · Timer v1.2.0</p>
      <h1 id="page-title">Timer</h1>
      <p class="intro-copy">Selvstendig nedtellingstimer med ferdigtilstand.</p>
    </section>
    <section class="timer-panel" aria-labelledby="timer-heading">
      <h2 id="timer-heading">Still inn tiden</h2>
      <label for="secs">Sekunder</label>
      <input id="secs" name="secs" type="number" min="1" value="60" inputmode="numeric">
      <p id="output" class="timer-display" aria-live="polite">01:00</p>
      <p id="status" class="timer-status" role="status" aria-live="polite">Klar</p>
      <div class="timer-actions">
        <button id="start" class="primary-button" type="button">Start</button>
        <button id="pause" class="secondary-button" type="button">Pause</button>
        <button id="reset" class="secondary-button" type="button">Nullstill</button>
      </div>
    </section>
    <p class="privacy-note">Timeren kjører bare i denne fanen. Ingen innlogging, lagring eller tilkobling til en tjeneste.</p>
  </main>
  <footer class="site-footer"><a class="footer-brand" href="/vibe/">Tilbake til Vibe</a><span>Timer v1.2.0</span></footer>
</body>
</html>
